<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 400px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
    }
    h2 { margin: 0 0 15px 0; font-size: 16px; }
    .lead {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .lead:hover { background: #f5f5f5; }
    .lead-name { font-weight: 600; }
    .lead-company { color: #666; font-size: 12px; }
    .lead-msg { color: #888; font-size: 11px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn {
      background: #0a66c2;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 5px;
    }
    .btn:hover { background: #004182; }
    .btn-confirm {
      background: #057642;
      width: 100%;
      margin-top: 15px;
    }
    .status { color: #666; padding: 20px; text-align: center; }
    .sent { opacity: 0.5; }
    .sent::after { content: " ✓ Opened"; color: green; }
  </style>
</head>
<body>
  <h2>LinkedIn Sender</h2>
  <div id="content">
    <div class="status">Loading leads...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
